name: Build macOS arm64

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Gesture recognizer regression tests
        run: |
          set -euo pipefail
          /usr/bin/xcrun swiftc \
            Sources/BTTLite/Models.swift \
            Sources/BTTLite/GestureRecognizerCore.swift \
            Tests/GestureRecognizerRegression.swift \
            -o /tmp/btt-gesture-regression
          /tmp/btt-gesture-regression
      - name: Build application
        run: ./scripts/build-app.sh
      - name: Smoke test packaged app
        run: |
          set -euo pipefail
          APP="dist/BTT Lite.app"
          test -x "$APP/Contents/MacOS/BTTLite"
          test -x "$APP/Contents/Helpers/BTTLiteBluetoothHelper.app/Contents/MacOS/BTTLiteBluetoothHelper"
          test -x "$APP/Contents/Helpers/BTTLiteJavaScriptHelper"
          /usr/bin/codesign --verify --strict "$APP/Contents/Helpers/BTTLiteBluetoothHelper.app"
          /usr/libexec/PlistBuddy -c "Print :NSBluetoothAlwaysUsageDescription" "$APP/Contents/Helpers/BTTLiteBluetoothHelper.app/Contents/Info.plist" | /usr/bin/grep -q "Bluetooth"
          set +e
          "$APP/Contents/Helpers/BTTLiteBluetoothHelper.app/Contents/MacOS/BTTLiteBluetoothHelper" >/tmp/btt-bt-out 2>/tmp/btt-bt-err
          BT_STATUS=$?
          set -e
          test "$BT_STATUS" -eq 64
          /usr/bin/grep -q "Usage:" /tmp/btt-bt-err
          /usr/bin/codesign --verify --deep --strict "$APP"
          /usr/bin/file "$APP/Contents/MacOS/BTTLite" | /usr/bin/grep -q "arm64"
          /usr/libexec/PlistBuddy -c "Print :NSBluetoothAlwaysUsageDescription" "$APP/Contents/Info.plist" | /usr/bin/grep -q "Bluetooth"
          printf '%s' '{"script":"async (text) => text.toUpperCase()","text":"hello"}'             | "$APP/Contents/Helpers/BTTLiteJavaScriptHelper" > /tmp/btt-js-smoke.json
          /usr/bin/python3 - <<'PY'
          import json
          with open("/tmp/btt-js-smoke.json", "r", encoding="utf-8") as f:
              value = json.load(f)
          assert value.get("ok") is True, value
          assert value.get("result") == "HELLO", value
          assert not value.get("error"), value
          PY
          test -s dist/BTT-Lite-arm64.zip
      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: BTT-Lite-arm64
          path: dist/BTT-Lite-arm64.zip
          if-no-files-found: error
