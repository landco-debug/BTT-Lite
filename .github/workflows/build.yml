name: Build macOS arm64

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Build application
        run: ./scripts/build-app.sh
      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: BTT-Lite-arm64
          path: dist/BTT-Lite-arm64.zip
          if-no-files-found: error
